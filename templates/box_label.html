<!doctype html><html><head><meta charset="utf-8">
<style>
  @page { size: 320px 240px; margin: 0; }
  html,body{margin:0;padding:0;width:320px;height:240px;background:#fff;
    font-family:"Noto Sans CJK SC","Source Han Sans SC","DejaVu Sans",sans-serif;color:#000;}
  .card{position:relative;width:320px;height:240px;box-sizing:border-box;padding:12px 14px;}
  .rule{position:absolute;left:14px;right:14px;top:8px;height:4px;background:#000;}
  .kicker{position:absolute;left:14px;top:18px;font-size:11px;letter-spacing:2px;}
  .title{position:absolute;left:14px;top:34px;font-size:30px;font-weight:900;line-height:1.05;letter-spacing:1px;}
  .sub{position:absolute;left:14px;top:96px;font-size:14px;font-weight:700;}
  .desc{position:absolute;left:14px;top:118px;width:170px;font-size:11px;line-height:1.35;}
  .icon{position:absolute;left:14px;bottom:14px;width:56px;height:56px;}
  .qr{position:absolute;right:12px;bottom:12px;width:104px;height:104px;}
  .boxno{position:absolute;right:12px;top:26px;font-size:13px;font-weight:700;}
  .foot{position:absolute;left:14px;bottom:4px;font-size:9px;letter-spacing:1px;}
  .chip{position:absolute;right:12px;top:8px;border:2px solid #000;border-radius:3px;
        padding:2px 6px;font-size:11px;font-weight:700;}
</style></head><body>
<div class="card">
  <div class="rule"></div>
  <div class="chip">{{TYPE}}</div>
  <div class="kicker">STORAGE LOCATION · 库位</div>
  <div class="title">{{NAME}}</div>
  <div class="sub">{{SHORT}}</div>
  <div class="desc">{{DESC}}</div>
  {{ICON}}
  {{QR}}
  <div class="foot">共风 GoFor · Part-DB #{{ID}}</div>
</div></body></html>
