<!doctype html><html><head><meta charset="utf-8">
<style>
  /* 画布 320x240px = 40x30mm@203dpi；可打印区 x 0-304px(38mm) y 32-216px(4-27mm) */
  html,body{margin:0;padding:0;width:320px;height:240px;background:#fff;overflow:hidden;
    font-family:"Source Han Sans CN","思源黑体 CN","Noto Sans CJK SC","DejaVu Sans",sans-serif;color:#000;}
  .card{position:relative;width:320px;height:240px;}
  .rule{position:absolute;left:8px;right:104px;top:34px;height:4px;background:#000;}
  .kicker{position:absolute;left:8px;top:44px;font-size:10px;letter-spacing:2px;}
  .chip{position:absolute;right:16px;top:34px;border:2px solid #000;border-radius:3px;
        padding:1px 5px;font-size:10px;font-weight:700;}
  .title{position:absolute;left:8px;top:56px;width:296px;font-size:27px;
        font-family:"Source Han Sans CN Heavy","思源黑体 CN Heavy","SimHei","黑体",sans-serif;font-weight:900;
        line-height:1.1;letter-spacing:0.5px;}
  .sub{position:absolute;left:8px;top:104px;font-size:14px;font-weight:700;}
  .desc{position:absolute;left:8px;top:126px;width:186px;font-size:11px;line-height:1.35;
        font-family:"Source Han Sans CN","思源黑体 CN",sans-serif;}
  .icon{position:absolute;left:8px;bottom:26px;width:52px;height:52px;}
  .qr{position:absolute;right:16px;bottom:24px;width:96px;height:96px;}
  .idtag{position:absolute;left:8px;bottom:8px;font-size:9px;letter-spacing:1px;}
</style></head><body>
<div class="card">
  <div class="chip">{{TYPE}}</div>
  <div class="rule"></div>
  <div class="kicker">STORAGE · 库位 #{{ID}}</div>
  <div class="title">{{NAME}}</div>
  <div class="sub">{{SHORT}}</div>
  <div class="desc">{{DESC}}</div>
  {{ICON}}
  {{QR}}
</div></body></html>
